name: APK to branch

# Test only (never on main). Builds the debug APK and puts it on the branch lock-out-apk, so it can be fetched with git.
on:
  workflow_dispatch:
  push:
    branches: ['lock-run-apk']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build the debug APK
        run: gradle assembleDebug --no-daemon
      - name: Put the APK on the branch lock-out-apk
        run: |
          set -e
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/pub/Dinacharya-Launcher-build91.apk
          cd /tmp/pub
          git init -q
          git checkout -q -b lock-out-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "for ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -q -m "APK for ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin lock-out-apk
