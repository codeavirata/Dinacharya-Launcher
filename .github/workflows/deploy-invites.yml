name: Deploy invite server

# Puts the invite server (server/) on Cloudflare Workers. Run it by hand: Actions > Deploy invite server > Run workflow.
# It needs two GitHub secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (README, "Invite server").
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: npm test
      - name: Make the database if it is not there, and write its id into wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx --yes wrangler@4 d1 create dinacharya-invites || true
          ID=$(npx --yes wrangler@4 d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='dinacharya-invites');if(!d){process.exit(1)};console.log(d.uuid)")
          sed -i "s/REPLACE_WITH_DATABASE_ID/$ID/" wrangler.toml
          npx --yes wrangler@4 d1 execute dinacharya-invites --remote --file=schema.sql
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
