name: Screenshots

# Builds the "shots" test build, runs it on an Android emulator, and walks through the whole app (see app/src/shots): every tab, every
# settings page, every sheet and screen, in two sets of colours and two languages, with Pro on. The pictures are kept as a workflow
# artifact (full size) and pushed to the branch "shots-out" (half size, JPEG) so they can be looked at without downloading anything.
#
# Run it from the Actions tab ("Run workflow"), or by pushing the branch "shots-run".
on:
  workflow_dispatch:
  push:
    branches: [shots-run]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build the shots APK
        run: gradle assembleShots --no-daemon

      - name: Keep the shots APK (to install on a phone)
        uses: actions/upload-artifact@v4
        with:
          name: Dinacharya-shots-apk
          path: app/build/outputs/apk/shots/app-shots.apk

      - name: Is hardware acceleration there?
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            ls -l /dev/kvm
            echo "have=yes" >> "$GITHUB_OUTPUT"
          else
            echo "No /dev/kvm on this runner."
            echo "have=no" >> "$GITHUB_OUTPUT"
          fi
          nproc; free -m

      - name: Run the tour on an emulator
        if: steps.kvm.outputs.have == 'yes'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot
          script: bash tools/shots/run.sh

      - name: No emulator on this runner
        if: steps.kvm.outputs.have != 'yes'
        run: |
          mkdir -p shots-result
          echo "RESULT: no-kvm (this runner has no hardware acceleration, so the x86 emulator cannot run)" | tee shots-result/status.txt

      - name: Keep the pictures (full size)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dinacharya-shots
          path: shots-result
          if-no-files-found: ignore

      - name: Publish a small copy on the branch shots-out
        if: always()
        run: |
          set -e
          [ -d shots-result ] || mkdir -p shots-result
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp shots-result/status.txt shots-result/log.txt shots-result/logcat.txt /tmp/pub/ 2>/dev/null || true
          cp shots-result/real-screen-at-end.png /tmp/pub/ 2>/dev/null || true
          tail -c 400000 shots-result/logcat-full.txt > /tmp/pub/logcat-tail.txt 2>/dev/null || true
          for dir in shots-result/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            mkdir -p "/tmp/pub/$name"
            for f in "$dir"*.png; do
              [ -e "$f" ] || continue
              convert "$f" -resize 50% -quality 72 "/tmp/pub/$name/$(basename "${f%.png}").jpg" 2>/dev/null || cp "$f" "/tmp/pub/$name/"
            done
          done
          cd /tmp/pub
          git init -q
          git checkout -q -b shots-out
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "run ${{ github.run_id }} for ${{ github.sha }}" > RUN.txt
          git add -A
          git commit -q -m "Pictures from the run on ${{ github.sha }}"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin shots-out
